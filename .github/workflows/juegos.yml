name: Juegos para el carro

on:
  push:
    paths:
      - "juegos/**"
      - ".github/workflows/juegos.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: juegos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: juegos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Llave de firma (opcional)
        env:
          LLAVE: ${{ secrets.JUEGOS_KEYSTORE_B64 }}
        run: |
          if [ -n "$LLAVE" ]; then echo "$LLAVE" | base64 -d > app/juegos.keystore; echo "Firmado con la llave fija" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Compilar APK
        env:
          JUEGOS_KS_PASS: ${{ secrets.JUEGOS_KS_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain
          cp app/build/outputs/apk/release/app-release.apk juegos-carro.apk
          echo "APK: $(( $(stat -c%s juegos-carro.apk) / 1024 )) KB" >> "$GITHUB_STEP_SUMMARY"

      - name: Versión y novedades
        run: |
          python3 - <<'PY'
          import json, re
          text = open("app/src/main/assets/novedades.txt", encoding="utf-8").read()
          code = int(next(m.group(1) for m in (re.match(r"^(\d+)\|", l.strip()) for l in text.splitlines()) if m))
          json.dump({"code": code, "name": f"1.{code}", "notes": text}, open("version.json", "w", encoding="utf-8"), ensure_ascii=False)
          print("Versión", code)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: juegos-carro-apk
          path: juegos/juegos-carro.apk

      - name: Publicar en la release "juegos-carro"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: juegos-carro
          name: Juegos para el carro
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            APK de los juegos para la pantalla del carro (Android 5.1 en adelante).
            Descarga juegos-carro.apk, cópialo a una memoria USB e instálalo con el explorador de archivos.
            Compilado desde ${{ github.sha }}.
          files: |
            juegos/juegos-carro.apk
            juegos/version.json
