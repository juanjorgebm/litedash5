name: Dashcam Okavango

# App de dashcam independiente para el Okavango (Android 5.1).
on:
  push:
    paths: ["tools/dashcam/**", ".github/workflows/dashcam.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Compilar
        run: tools/dashcam/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dashcam-okavango
          path: tools/dashcam/build/dashcam-okavango.apk
      - name: Publicar en la versión "dashcam-okavango"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dashcam-okavango >/dev/null 2>&1 || \
            gh release create dashcam-okavango --prerelease --target "$GITHUB_SHA" \
              --title "Dashcam Okavango" --notes "App de dashcam para el Okavango (Android 5.1). Graba la cámara 360 a la USB solo con el carro en movimiento."
          gh release upload dashcam-okavango tools/dashcam/build/dashcam-okavango.apk --clobber
