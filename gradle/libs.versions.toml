[versions]
agp = "9.5.0"
kotlin = "2.4.21"
# Android 5 (API 21): las versiones más nuevas de AndroidX ya piden minSdk 23.
# Compose 1.8.x, activity 1.10.x y core 1.16.x son las últimas que corren en Lollipop.
composeBom = "2025.07.00"
activityCompose = "1.10.1"
core = "1.16.0"
profileinstaller = "1.4.1"
benchmark = "1.5.0"
uiautomator = "2.4.0"
junitExt = "1.3.0"
junit = "4.13.2"
json = "20250517"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
core = { group = "androidx.core", name = "core", version.ref = "core" }
profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
benchmark-macro = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }
uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitExt" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
json = { group = "org.json", name = "json", version.ref = "json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
